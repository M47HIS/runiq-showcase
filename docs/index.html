<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Try the mobile Plan workflow from RunIQ, a running coach. Move, review and save workouts in a fictional training week.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#10161f">
  <title>RunIQ · Plan demo</title>
  <link rel="icon" href="./mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-brand">
      <span class="brand"><img src="./mark.svg" width="34" height="34" alt="">RunIQ</span>
      <span class="masthead-label">Plan demo</span>
    </div>
    <a href="https://github.com/M47HIS/runiq-showcase">Source code <span aria-hidden="true">↗</span></a>
  </header>
  <main>
    <section class="intro" aria-labelledby="demo-title">
      <h1 id="demo-title">Make the week fit.</h1>
      <p>Try rescheduling a workout in a fictional training week. See what moves before you save.</p>
      <button id="try-move" class="primary" type="button" hidden>Move the interval session <span aria-hidden="true">↓</span></button>
    </section>
    <section class="plan" aria-labelledby="week-title">
      <header class="plan-header">
        <div><h2 id="week-title" tabindex="-1">Training week</h2><p>16–22 March 2026</p></div>
        <p id="week-summary"></p>
      </header>
      <p id="status" class="status" role="status"></p>
      <div id="editor">
        <noscript>Enable JavaScript to try the Plan demo.</noscript>
      </div>
      <footer><span>Saved in this browser</span><button id="reset" class="quiet" type="button" hidden>Reset demo</button></footer>
    </section>
  </main>
</body>
</html>
